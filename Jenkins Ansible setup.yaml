---
- name: Fully automate Jenkins setup on Amazon Linux 2
  hosts: jenkins
  become: yes

  vars:
    jenkins_port: 8080
    jenkins_admin_user: admin
    jenkins_admin_password: Admin@123

  tasks:

    - name: Update packages
      yum:
        name: "*"
        state: latest

    - name: Download Amazon Corretto 21 RPM
      get_url:
        url: https://corretto.aws/downloads/latest/amazon-corretto-21-x64-linux-jdk.rpm
        dest: /tmp/amazon-corretto-21.rpm
        mode: '0644'

    - name: Install Amazon Corretto 21
      yum:
        name: /tmp/amazon-corretto-21.rpm
        state: present

    - name: Set Java 21 as default
      alternatives:
        name: java
        path: /usr/lib/jvm/java-21-amazon-corretto/bin/java

    - name: Set Javac 21 as default
      alternatives:
        name: javac
        path: /usr/lib/jvm/java-21-amazon-corretto/bin/javac    

    - name: Set global JAVA_HOME
      copy:
         dest: /etc/profile.d/java.sh
         mode: '0755'
         content: |
           export JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto
           export PATH=$JAVA_HOME/bin:$PATH

    - name: Verify active Java version
      command: java -version
      register: java_version
      changed_when: false

    - name: Show active Java version
      debug:
        msg: "{{ java_version.stderr }}"



    - name: Install Git
      yum:
        name: git
        state: present

    - name: Verify Git installation
      command: git --version
      register: git_version
      changed_when: false

    - name: Show Git version
      debug:
        msg: "{{ git_version.stdout }}"

    - name: Download Maven 3.9.6
      get_url:
        url: https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
        dest: /tmp/apache-maven-3.9.6-bin.tar.gz
    
    - name: Extract Maven
      unarchive:
        src: /tmp/apache-maven-3.9.6-bin.tar.gz
        dest: /opt/
        remote_src: yes
    
    - name: Create Maven Symlink
      file:
        src: /opt/apache-maven-3.9.6
        dest: /opt/maven
        state: link
    
    - name: Configure Maven Environment
      copy:
        dest: /etc/profile.d/maven.sh
        content: |
          export MAVEN_HOME=/opt/maven
          export PATH=$MAVEN_HOME/bin:$PATH
        mode: '0755'
    
    - name: Set Maven for Current Session
      shell: |
        export MAVEN_HOME=/opt/maven
        export PATH=$MAVEN_HOME/bin:$PATH
        mvn -version


    - name: Verify Maven installation
      command: mvn -version
      register: mvn_version
      changed_when: false
    
    - name: Show Maven version
      debug:
        msg: "{{ mvn_version.stdout }}"
        
    
    - name: Install Docker
      yum:
        name: docker
        state: present
    
    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes
    
    # 🔥 CRITICAL FIX: create docker group (safe if already exists)
    - name: Ensure docker group exists
      group:
        name: docker
        state: present
    
    # 🔥 CRITICAL FIX: add jenkins user to docker group
    - name: Add Jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: yes
    
    # 🔥 ensure socket permissions are correct
    - name: Set correct permissions for docker socket (safe)
      file:
        path: /var/run/docker.sock
        mode: '0660'
    
    # 🔥 restart services so group changes take effect
    - name: Restart Docker
      systemd:
        name: docker
        state: restarted
    
    # 🔍 verification
    - name: Verify Docker access
      command: docker ps
      become_user: jenkins
      register: docker_check
      changed_when: false
    
    - debug:
        msg: "Docker is working for Jenkins user"
        

    - name: Add Jenkins repo
      get_url:
        url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo

    - name: Import Jenkins GPG key
      rpm_key:
        key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
        state: present

    - name: Install Jenkins
      yum:
        name: jenkins
        state: present

    - name: Configure Jenkins Java options
      lineinfile:
        path: /etc/sysconfig/jenkins
        regexp: '^JENKINS_JAVA_OPTIONS='
        line: 'JENKINS_JAVA_OPTIONS="-Djenkins.install.runSetupWizard=false"'
        create: yes
    
    - name: Set Jenkins JAVA_HOME
      lineinfile:
        path: /etc/sysconfig/jenkins
        regexp: '^JAVA_HOME='
        line: 'JAVA_HOME="/usr/lib/jvm/java-21-amazon-corretto"'
        create: yes
    
    - name: Set Jenkins Java command
      lineinfile:
        path: /etc/sysconfig/jenkins
        regexp: '^JENKINS_JAVA_CMD='
        line: 'JENKINS_JAVA_CMD="/usr/lib/jvm/java-21-amazon-corretto/bin/java"'
        create: yes

    - name: Create init.groovy.d directory
      file:
        path: /var/lib/jenkins/init.groovy.d
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'

    - name: Create admin user via Groovy script
      copy:
        dest: /var/lib/jenkins/init.groovy.d/basic-security.groovy
        owner: jenkins
        group: jenkins
        mode: '0644'
        content: |
          #!groovy
          import jenkins.model.*
          import hudson.security.*

          def instance = Jenkins.getInstance()

          def hudsonRealm = new HudsonPrivateSecurityRealm(false)
          hudsonRealm.createAccount("{{ jenkins_admin_user }}", "{{ jenkins_admin_password }}")
          instance.setSecurityRealm(hudsonRealm)

          def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
          strategy.setAllowAnonymousRead(false)
          instance.setAuthorizationStrategy(strategy)

          instance.save()

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Check JAVA_HOME
      shell: echo $JAVA_HOME
      register: java_home_check

    - debug:
        msg: "{{ java_home_check.stdout }}"

    - name: Start and enable Jenkins
      systemd:
        name: jenkins
        enabled: yes
        state: started

    - name: Restart Jenkins
      systemd:
        name: jenkins
        state: restarted

    - name: Wait for Jenkins to start
      wait_for:
        port: "{{ jenkins_port }}"
        delay: 15
        timeout: 180

    - name: Show Jenkins URL
      debug:
        msg: "Jenkins is ready at http://{{ hostvars[inventory_hostname]['ansible_host'] }}:{{ jenkins_port }}"

    - name: Show login credentials
      debug:
        msg: "Username: {{ jenkins_admin_user }} | Password: {{ jenkins_admin_password }}"
