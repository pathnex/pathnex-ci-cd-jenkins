---
- name: Install and Configure Jenkins on Amazon Linux 2
  hosts: jenkins
  become: true

  vars:
    jenkins_port: 8080
    jenkins_admin_user: admin
    jenkins_admin_password: Admin@123
    java_home: /usr/lib/jvm/java-21-amazon-corretto

  tasks:

    ####################################################################
    # Update OS
    ####################################################################

    - name: Update all packages
      yum:
        name: "*"
        state: latest

    ####################################################################
    # Java 21
    ####################################################################

    - name: Download Amazon Corretto 21
      get_url:
        url: https://corretto.aws/downloads/latest/amazon-corretto-21-x64-linux-jdk.rpm
        dest: /tmp/corretto21.rpm

    - name: Install Corretto 21
      yum:
        name: /tmp/corretto21.rpm
        state: present

    - name: Set Java alternative
      alternatives:
        name: java
        path: "{{ java_home }}/bin/java"

    - name: Set Javac alternative
      alternatives:
        name: javac
        path: "{{ java_home }}/bin/javac"

    - name: Configure JAVA_HOME
      copy:
        dest: /etc/profile.d/java.sh
        mode: '0755'
        content: |
          export JAVA_HOME={{ java_home }}
          export PATH=$JAVA_HOME/bin:$PATH

    ####################################################################
    # Required packages
    ####################################################################

    - name: Install packages
      yum:
        name:
          - git
          - wget
          - curl
          - unzip
          - fontconfig
        state: present

    ####################################################################
    # Maven
    ####################################################################

    - name: Check Maven
      stat:
        path: /opt/maven/bin/mvn
      register: maven_exists

    - name: Download Maven
      get_url:
        url: https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
        dest: /tmp/maven.tar.gz
      when: not maven_exists.stat.exists

    - name: Extract Maven
      unarchive:
        src: /tmp/maven.tar.gz
        dest: /opt
        remote_src: yes
      when: not maven_exists.stat.exists

    - name: Create Maven symlink
      file:
        src: /opt/apache-maven-3.9.6
        dest: /opt/maven
        state: link

    - name: Configure Maven
      copy:
        dest: /etc/profile.d/maven.sh
        mode: '0755'
        content: |
          export MAVEN_HOME=/opt/maven
          export PATH=$MAVEN_HOME/bin:$PATH

    ####################################################################
    # Docker
    ####################################################################

    - name: Install Docker
      yum:
        name: docker
        state: present

    - name: Enable Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    ####################################################################
    # Jenkins Repository
    ####################################################################

    - name: Download Jenkins repo
      get_url:
        url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo

    - name: Import Jenkins key
      rpm_key:
        state: present
        key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key

    ####################################################################
    # Install Jenkins
    ####################################################################

    - name: Install Jenkins
      yum:
        name: jenkins
        state: present

    ####################################################################
    # Docker Permissions
    ####################################################################

    - name: Ensure docker group exists
      group:
        name: docker
        state: present

    - name: Add Jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    ####################################################################
    # Disable setup wizard
    ####################################################################

    - name: Create override directory
      file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory

    - name: Configure Jenkins JVM options
      copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        content: |
          [Service]
          Environment="JAVA_HOME={{ java_home }}"
          Environment="JENKINS_JAVA_OPTIONS=-Djenkins.install.runSetupWizard=false"

    ####################################################################
    # Create Admin User
    ####################################################################

    - name: Create init.groovy.d
      file:
        path: /var/lib/jenkins/init.groovy.d
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'

    - name: Create admin user
      copy:
        dest: /var/lib/jenkins/init.groovy.d/basic-security.groovy
        owner: jenkins
        group: jenkins
        mode: '0644'
        content: |
          import jenkins.model.Jenkins
          import hudson.security.*

          def instance = Jenkins.get()

          def realm = new HudsonPrivateSecurityRealm(false)
          realm.createAccount("{{ jenkins_admin_user }}","{{ jenkins_admin_password }}")
          instance.setSecurityRealm(realm)

          def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
          strategy.setAllowAnonymousRead(false)
          instance.setAuthorizationStrategy(strategy)

          instance.save()

    ####################################################################
    # Start Jenkins
    ####################################################################

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart Docker
      systemd:
        name: docker
        state: restarted

    - name: Enable Jenkins
      systemd:
        name: jenkins
        enabled: yes
        state: restarted

    - name: Wait for Jenkins
      wait_for:
        port: "{{ jenkins_port }}"
        delay: 20
        timeout: 300

    ####################################################################
    # Verification
    ####################################################################

    - name: Verify Java
      command: java -version
      register: java_version
      changed_when: false

    - debug:
        var: java_version.stderr_lines

    - name: Verify Maven
      command: /opt/maven/bin/mvn -version
      register: maven_version
      changed_when: false

    - debug:
        var: maven_version.stdout_lines

    - name: Verify Git
      command: git --version
      register: git_version
      changed_when: false

    - debug:
        var: git_version.stdout

    - name: Verify Docker
      command: docker ps
      become_user: jenkins
      changed_when: false

    - name: Jenkins URL
      debug:
        msg: "http://{{ ansible_host }}:8080"

    - name: Jenkins Credentials
      debug:
        msg: "Username={{ jenkins_admin_user }} Password={{ jenkins_admin_password }}"
